<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>𓃥 機械翻板訊息傳遞 App - 中英數智慧識別版</title>
    <style>
        body { 
            background-color: #0e1117; margin: 0; 
            display: flex; flex-direction: column; align-items: center; 
            min-height: 100vh; font-family: "Microsoft JhengHei", sans-serif;
            user-select: none; color: #fff;
        }

        /* 16:9 頂部手機顯示視窗 */
        .window-viewport { 
            width: 100vw; 
            aspect-ratio: 16 / 9; 
            background: #000; 
            overflow: hidden; 
            position: relative;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            border-bottom: 1px solid #222;
        }

        /* 實際並排所有翻板的長軌道 */
        .pan-track {
            display: flex;
            height: 100%;
            align-items: center;
            padding-left: 6vw; 
            gap: 3vw; 
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1); 
            transform: translateX(0px);
        }

        /* 恢復界面按鈕 */
        .restore-btn {
            position: absolute; bottom: 10px; right: 10px;
            background: rgba(255,255,255,0.2); color: #fff;
            border: none; padding: 6px 12px; border-radius: 4px;
            font-size: 0.75rem; cursor: pointer; display: none; z-index: 100;
        }

        /* 基礎翻板外殼 */
        .flip-card { 
            position: relative; 
            background: #1a1a1a; 
            border-radius: 6px; 
            font-weight: 900; 
            perspective: 600px; 
            color: #fff; 
            flex-shrink: 0; 
            width: 20vw;
            height: 28vw;
            max-width: 110px;
            max-height: 154px;
            font-size: clamp(2.5rem, 12vw, 5.5rem);
            box-shadow: 0 8px 20px rgba(0,0,0,0.7);
        }

        /* 實體物理硬裁剪 */
        .half-panel {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #1a1a1a; display: flex; align-items: center; justify-content: center;
            border-radius: 6px; box-sizing: border-box;
            backface-visibility: hidden; -webkit-backface-visibility: hidden;
        }

        .half-panel span {
            display: inline-block;
            transform: scaleY(1.3);
            transform-origin: center center;
        }

        .static-top { 
            clip-path: inset(0% 0% 50% 0%); 
            border-bottom: 1px solid rgba(0,0,0,0.6); 
        }
        .static-bottom { 
            clip-path: inset(50% 0% 0% 0%); 
        }

        .leaf-wrapper {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10;
            transform-style: preserve-3d;
            transform-origin: center center; 
            background: transparent;
        }

        .leaf-front-panel {
            clip-path: inset(0% 0% 50% 0%);
            border-bottom: 1px solid rgba(0,0,0,0.6);
        }
        .leaf-back-panel {
            clip-path: inset(50% 0% 0% 0%);
            transform: rotateX(180deg);
        }

        .flipping .leaf-wrapper {
            animation: flipDownAnimation 0.18s cubic-bezier(0.37, 0, 0.63, 1) forwards;
        }
        @keyframes flipDownAnimation {
            0% { transform: rotateX(0deg); z-index: 12; }
            49% { z-index: 12; }
            50% { z-index: 9; }
            100% { transform: rotateX(-180deg); z-index: 9; }
        }

        /* 下方操作界面 */
        .control-panel { 
            background: #161b22; padding: 20px; border-radius: 12px; 
            width: 90vw; max-width: 560px; margin-top: 20px;
            box-sizing: border-box; border: 1px solid #30363d;
        }
        textarea { 
            width: 100%; height: 90px; background: #0d1117; color: #c9d1d9; 
            border: 1px solid #30363d; padding: 12px; box-sizing: border-box; 
            margin-bottom: 15px; border-radius: 6px; font-size: 1rem; resize: none;
        }
        textarea:focus { outline: 1px solid #58a6ff; }
        
        .btn-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        button { 
            background: #ffffff; color: #000000; border: none;
            padding: 10px 4px; border-radius: 20px; font-size: 0.85rem; font-weight: bold;
            cursor: pointer; transition: 0.2s; text-align: center;
        }
        button:hover { background: #e0e0e0; }

        #recordingCanvas { display: none; }
    </style>
</head>
<body>

<div class="window-viewport" id="viewport">
    <div class="pan-track" id="panTrack"></div>
    <button class="restore-btn" id="restoreBtn" onclick="toggleControls(true)">顯示控制界面</button>
</div>

<div class="control-panel" id="controlPanel">
    <textarea id="msgInput" placeholder="請輸入欲傳遞的訊息（例如：2026新年Happy）"></textarea>
    <div class="btn-row">
        <button onclick="playCurrentInput()">預覽顯示</button>
        <button onclick="shareURL()">產生網址</button>
        <button id="recBtn" onclick="startAutoRecordFlow()">錄影存檔</button>
        <button onclick="toggleControls(false)">隱藏界面</button>
    </div>
</div>

<canvas id="recordingCanvas" width="1280" height="720"></canvas>

<script>
    let currentStates = {};
    let cardRandomTargets = {}; 
    let cardSequences = {}; // 儲存每塊板子專屬的字庫序列
    let audioCtx = null;
    let mediaRecorder = null;
    let recordedChunks = [];
    let isPlaying = false;
    let isRecordingActive = false;

    let canvasTrackX = 0; 
    let targetCanvasTrackX = 0;

    const NUM_SEQ = "0123456789".split('');
    const ALPHA_SEQ = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split('');
    const PADDING_CHINESE = "甲乙丙丁戊己".split('');

    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function playFlapSound() {
        if (!audioCtx) return;
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(140, audioCtx.currentTime); 
            osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.04);
            gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
            osc.start(); osc.stop(audioCtx.currentTime + 0.05);
        } catch (e) {}
    }

    function createPanelHTML(initialChar) {
        const displayChar = initialChar === " " ? "&nbsp;" : initialChar;
        return `
            <div class="half-panel static-top"><span>${displayChar}</span></div>
            <div class="half-panel static-bottom"><span>${displayChar}</span></div>
            <div class="leaf-wrapper">
                <div class="half-panel leaf-front-panel"><span>${displayChar}</span></div>
                <div class="half-panel leaf-back-panel"><span>${displayChar}</span></div>
            </div>
        `;
    }

    // 判斷字元類型
    function getCharType(char) {
        if (/[0-9]/.test(char)) return 'number';
        if (/[A-Za-z]/.test(char)) return 'alpha';
        if (/[\u4e00-\u9fa5]/.test(char) || PADDING_CHINESE.includes(char)) return 'chinese';
        return 'space';
    }

    // 🛠️ 智慧化構建軌道：依據中英數分類建立各自的隨選字庫
    function rebuildTrack(charsArray, chinesePool) {
        const track = document.getElementById('panTrack');
        track.innerHTML = "";
        currentStates = {};
        cardRandomTargets = {}; 
        cardSequences = {};
        track.style.transform = "translateX(0px)"; 
        
        canvasTrackX = 0;
        targetCanvasTrackX = 0;

        for (let i = 0; i < charsArray.length; i++) {
            const cardId = `card-${i}`;
            const targetChar = charsArray[i].toUpperCase();
            const type = getCharType(targetChar);

            let seq = [];
            let randomPick = " ";

            if (type === 'number') {
                seq = [...NUM_SEQ];
                const pool = seq.filter(c => c !== targetChar);
                randomPick = pool.length > 0 ? pool[Math.floor(Math.random() * pool.length)] : seq[0];
            } else if (type === 'alpha') {
                seq = [...ALPHA_SEQ];
                const pool = seq.filter(c => c !== targetChar);
                randomPick = pool.length > 0 ? pool[Math.floor(Math.random() * pool.length)] : seq[0];
            } else if (type === 'chinese') {
                seq = [...chinesePool];
                const pool = seq.filter(c => c !== targetChar);
                randomPick = pool.length > 0 ? pool[Math.floor(Math.random() * pool.length)] : seq[0];
            } else {
                seq = [" "];
                randomPick = " ";
            }

            cardSequences[cardId] = seq;
            cardRandomTargets[cardId] = randomPick;

            const card = document.createElement('div');
            card.className = 'flip-card';
            card.id = cardId;
            card.innerHTML = createPanelHTML(" "); // 初始狀態一律為空白
            track.appendChild(card);
            
            currentStates[cardId] = " "; 
        }
    }

    function runPhysicalFlipAnimation(id, newVal, oldVal) {
        const el = document.getElementById(id);
        if (!el) return;
        
        const displayNew = newVal === " " ? "<span>&nbsp;</span>" : `<span>${newVal}</span>`;
        const displayOld = oldVal === " " ? "<span>&nbsp;</span>" : `<span>${oldVal}</span>`;

        el.querySelector('.static-top').innerHTML = displayNew;
        el.querySelector('.static-bottom').innerHTML = displayOld;
        el.querySelector('.leaf-front-panel').innerHTML = displayOld;
        el.querySelector('.leaf-back-panel').innerHTML = displayNew;

        el.classList.remove('flipping');
        void el.offsetWidth; 
        el.classList.add('flipping');

        setTimeout(() => { playFlapSound(); }, 20);
        setTimeout(() => { el.querySelector('.static-bottom').innerHTML = displayNew; }, 160); 
    }

    // 雙階段翻轉流程
    function flipCardToTargetFlow(id, finalTargetVal) {
        return new Promise(async (resolve) => {
            finalTargetVal = finalTargetVal.toUpperCase();
            const randomTargetVal = cardRandomTargets[id];
            const baseSeq = cardSequences[id];

            if (baseSeq.length <= 1 && baseSeq[0] === " ") {
                resolve(); return; // 空白字元不需翻轉
            }

            // --- 第一階段：從 空白 ➡️ 隨機字 ---
            await new Promise((res) => {
                let current = currentStates[id];
                if (current === randomTargetVal) { res(); return; }

                let stepSeq = [" ", randomTargetVal];
                let idx = 0;

                let interval = setInterval(() => {
                    idx++;
                    let next = stepSeq[idx];
                    runPhysicalFlipAnimation(id, next, currentStates[id]);
                    currentStates[id] = next;

                    if (next === randomTargetVal) {
                        clearInterval(interval);
                        res();
                    }
                }, 140);
            });

            await new Promise(r => setTimeout(r, 300));

            // --- 第二階段：從 隨機字 ➡️ 最終目標字 ---
            await new Promise((res) => {
                let current = currentStates[id];
                if (current === finalTargetVal) { res(); return; }

                let startIdx = baseSeq.indexOf(current);
                let seq = [];
                if (startIdx !== -1) {
                    seq = baseSeq.slice(startIdx).concat(baseSeq.slice(0, startIdx));
                } else {
                    seq = [current, ...baseSeq];
                }

                let idx = 0;
                let interval = setInterval(() => {
                    idx = (idx + 1) % seq.length;
                    let next = seq[idx];
                    runPhysicalFlipAnimation(id, next, currentStates[id]);
                    currentStates[id] = next;

                    if (next === finalTargetVal) {
                        clearInterval(interval);
                        res();
                    }
                }, 140);
            });

            resolve();
        });
    }

    // 🛠️ 智慧字串解析與填充器
    async function processMessage(fullText) {
        if (isPlaying) return;
        isPlaying = true;
        initAudio();

        const lines = fullText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
        if (lines.length === 0) { isPlaying = false; return; }

        for (let line of lines) {
            // 1. 計算當前輸入字串中，純中文字的總數量
            let chineseChars = line.split('').filter(c => /[\u4e00-\u9fa5]/.test(c));
            let chineseCount = chineseChars.length;

            // 2. 建立中文字庫滾動池 (原始中文字 + 湊數用的補字)
            let chinesePool = [...chineseChars];
            if (chineseCount < 6) {
                let needPackCount = 6 - chineseCount;
                chinesePool = chinesePool.concat(PADDING_CHINESE.slice(0, needPackCount));
            }

            // 3. 建立最終要顯示在面板上的混和陣列
            let finalDisplayArray = line.split('');
            if (chineseCount < 6) {
                let needPackCount = 6 - chineseCount;
                // 將「甲乙丙丁...」依序補在字串的尾端
                finalDisplayArray = finalDisplayArray.concat(PADDING_CHINESE.slice(0, needPackCount));
            }

            // 4. 重構智慧型看板軌道
            rebuildTrack(finalDisplayArray, chinesePool);
            await new Promise(r => setTimeout(r, 500)); 

            const track = document.getElementById('panTrack');
            
            for (let i = 0; i < finalDisplayArray.length; i++) {
                if (i >= 4) {
                    const cardWidth = document.querySelector('.flip-card').offsetWidth;
                    const gapWidth = window.innerWidth * 0.03; 
                    const offset = (i - 3) * (cardWidth + gapWidth);
                    track.style.transform = `translateX(-${offset}px)`;
                    
                    targetCanvasTrackX = -(i - 3) * (140 + 20); 
                    await new Promise(r => setTimeout(r, 350)); 
                }

                await flipCardToTargetFlow(`card-${i}`, finalDisplayArray[i]);
                await new Promise(r => setTimeout(r, 180)); 
            }
            await new Promise(r => setTimeout(r, 1500)); 
        }

        isPlaying = false;

        if (isRecordingActive) {
            stopAndSaveRecording();
        }
    }

    function playCurrentInput() {
        const text = document.getElementById('msgInput').value;
        processMessage(text || "2026新年Happy");
    }

    // 錄影渲染引擎
    function drawCanvasFrame() {
        if (!isRecordingActive) return;

        const canvas = document.getElementById('recordingCanvas');
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = "#000000";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        canvasTrackX += (targetCanvasTrackX - canvasTrackX) * 0.1;

        ctx.save();
        ctx.translate(80 + canvasTrackX, 150); 

        const cardKeys = Object.keys(currentStates);
        cardKeys.forEach((key, index) => {
            const char = currentStates[key] || " ";
            const x = index * (140 + 20); 
            const y = 0;
            const w = 140;
            const h = 210;

            ctx.fillStyle = "#1a1a1a";
            ctx.beginPath();
            ctx.roundRect(x, y, w, h, 12);
            ctx.fill();

            ctx.strokeStyle = "rgba(0,0,0,0.6)";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(x, y + h/2);
            ctx.lineTo(x + w, y + h/2);
            ctx.stroke();

            if (char !== " ") {
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 110px 'Microsoft JhengHei', sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                
                ctx.save();
                ctx.translate(x + w/2, y + h/2);
                ctx.scale(1, 1.2);
                ctx.fillText(char, 0, 0);
                ctx.restore();
            }
        });

        ctx.restore();
        requestAnimationFrame(drawCanvasFrame);
    }

    function startAutoRecordFlow() {
        if (isPlaying) return;
        initAudio();
        toggleControls(false);
        
        const canvas = document.getElementById('recordingCanvas');
        isRecordingActive = true;
        
        drawCanvasFrame();

        const stream = canvas.captureStream(30);
        recordedChunks = [];
        
        let options = { mimeType: 'video/webm;codecs=vp8' };
        try {
            mediaRecorder = new MediaRecorder(stream, options);
        } catch(e) {
            mediaRecorder = new MediaRecorder(stream);
        }
        
        mediaRecorder.ondataavailable = e => { if (e.data && e.data.size > 0) recordedChunks.push(e.data); };
        mediaRecorder.onstop = () => {
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `flip_mix_video_${Date.now()}.webm`;
            a.click();
            toggleControls(true);
        };

        mediaRecorder.start();

        setTimeout(() => {
            playCurrentInput();
        }, 400);
    }

    function stopAndSaveRecording() {
        isRecordingActive = false;
        if (mediaRecorder && mediaRecorder.state === "recording") {
            mediaRecorder.stop();
        }
    }

    function toggleControls(show) {
        document.getElementById('controlPanel').style.display = show ? 'block' : 'none';
        document.getElementById('restoreBtn').style.display = show ? 'none' : 'block';
    }

    function shareURL() {
        const msg = document.getElementById('msgInput').value;
        if (!msg) { alert("請先輸入訊息再產生網址！"); return; }
        
        const currentUrl = window.location.href.split('?')[0];
        const finalUrl = `${currentUrl}?msg=${encodeURIComponent(msg)}`;

        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(finalUrl).then(() => {
                alert("網址已成功複製到剪貼簿！");
            }).catch(() => {
                window.prompt("因為瀏覽器安全限制，請全選並複製下方網址：", finalUrl);
            });
        } else {
            window.prompt("請全選並複製下方專屬分享網址：", finalUrl);
        }
    }

    window.onload = () => {
        rebuildTrack([" ", " ", " ", " "], []); 
        const params = new URLSearchParams(window.location.search);
        if (params.has('msg')) {
            document.getElementById('msgInput').value = params.get('msg');
            setTimeout(() => { startAutoRecordFlow(); }, 1200);
        }
    };
    window.addEventListener('click', initAudio, { once: true });
</script>

</body>
</html>
