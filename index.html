<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>𓃥 機械翻板訊息傳遞 App - 完美翻轉順序版</title>
    <style>
        body { 
            background-color: #0e1117; margin: 0; 
            display: flex; flex-direction: column; align-items: center; 
            min-height: 100vh; font-family: "Microsoft JhengHei", sans-serif;
            user-select: none; color: #fff;
        }

        /* 16:9 頂部手機顯示視窗 */
        .window-viewport { 
            width: 100vw; 
            aspect-ratio: 16 / 9; 
            background: #000; 
            overflow: hidden; 
            position: relative;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            border-bottom: 1px solid #222;
        }

        /* 實際並排所有翻板的長軌道 (Pan Track) */
        .pan-track {
            display: flex;
            height: 100%;
            align-items: center;
            padding-left: 6vw; 
            gap: 3vw; 
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1); 
            transform: translateX(0px);
        }

        /* 恢復界面按鈕 */
        .restore-btn {
            position: absolute; bottom: 10px; right: 10px;
            background: rgba(255,255,255,0.2); color: #fff;
            border: none; padding: 6px 12px; border-radius: 4px;
            font-size: 0.75rem; cursor: pointer; display: none; z-index: 100;
        }

        /* 基礎翻板外殼 */
        .flip-card { 
            position: relative; 
            background: #1a1a1a; 
            border-radius: 6px; 
            font-weight: 900; 
            perspective: 600px; 
            color: #fff; 
            flex-shrink: 0; 
            width: 20vw;
            height: 28vw;
            max-width: 110px;
            max-height: 154px;
            font-size: clamp(2.5rem, 12vw, 5.5rem);
            box-shadow: 0 8px 20px rgba(0,0,0,0.7);
        }

        /* 實體物理硬裁剪 */
        .half-panel {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #1a1a1a; display: flex; align-items: center; justify-content: center;
            border-radius: 6px; box-sizing: border-box;
            backface-visibility: hidden; -webkit-backface-visibility: hidden;
        }

        /* 文字拉長 */
        .half-panel span {
            display: inline-block;
            transform: scaleY(1.3);
            transform-origin: center center;
        }

        /* 固定底板 */
        .static-top { 
            clip-path: inset(0% 0% 50% 0%); 
            border-bottom: 1px solid rgba(0,0,0,0.6); 
        }
        .static-bottom { 
            clip-path: inset(50% 0% 0% 0%); 
        }

        /* 旋轉活動葉片容器 */
        .leaf-wrapper {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10;
            transform-style: preserve-3d;
            transform-origin: center center; 
            background: transparent;
        }

        .leaf-front-panel {
            clip-path: inset(0% 0% 50% 0%);
            border-bottom: 1px solid rgba(0,0,0,0.6);
        }
        .leaf-back-panel {
            clip-path: inset(50% 0% 0% 0%);
            transform: rotateX(180deg);
        }

        /* 機械下翻動畫 */
        .flipping .leaf-wrapper {
            animation: flipDownAnimation 0.18s cubic-bezier(0.37, 0, 0.63, 1) forwards;
        }
        @keyframes flipDownAnimation {
            0% { transform: rotateX(0deg); z-index: 12; }
            49% { z-index: 12; }
            50% { z-index: 9; }
            100% { transform: rotateX(-180deg); z-index: 9; }
        }

        /* 下方操作界面 */
        .control-panel { 
            background: #161b22; padding: 20px; border-radius: 12px; 
            width: 90vw; max-width: 560px; margin-top: 20px;
            box-sizing: border-box; border: 1px solid #30363d;
        }
        textarea { 
            width: 100%; height: 90px; background: #0d1117; color: #c9d1d9; 
            border: 1px solid #30363d; padding: 12px; box-sizing: border-box; 
            margin-bottom: 15px; border-radius: 6px; font-size: 1rem; resize: none;
        }
        textarea:focus { outline: 1px solid #58a6ff; }
        
        .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button { 
            background: #21262d; color: #c9d1d9; border: 1px solid #f0f6fc1a;
            padding: 12px; border-radius: 6px; font-size: 0.95rem; font-weight: bold;
            cursor: pointer; transition: 0.2s;
        }
        button:hover { background: #30363d; border-color: #8b949e; }
        button.action-rec { background: #238636; color: #fff; border-color: #2ea44f; }
        button.action-rec:hover { background: #2ea44f; }

        #recordingCanvas { display: none; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

<div class="window-viewport" id="viewport">
    <div class="pan-track" id="panTrack"></div>
    <button class="restore-btn" id="restoreBtn" onclick="toggleControls(true)">顯示控制界面</button>
</div>

<div class="control-panel" id="controlPanel">
    <textarea id="msgInput" placeholder="請輸入欲傳遞的訊息（例如：大家新年快樂）"></textarea>
    <div class="btn-row">
        <button onclick="playCurrentInput()">預覽顯示</button>
        <button onclick="shareURL()">URL 分享鈕</button>
        <button id="recBtn" class="action-rec" onclick="startAutoRecordFlow()">自動錄影鈕</button>
        <button onclick="toggleControls(false)">隱藏控制界面</button>
    </div>
</div>

<canvas id="recordingCanvas"></canvas>

<script>
    let currentStates = {};
    let cardRandomTargets = {}; // 儲存每塊板子被分配到的隨機字
    let audioCtx = null;
    let mediaRecorder = null;
    let recordedChunks = [];
    let isPlaying = false;
    let isRecordingActive = false;
    let canvasAnimLoop = null;

    const NUM_SEQ = "0123456789";
    const ALPHA_SEQ = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function playFlapSound() {
        if (!audioCtx) return;
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(140, audioCtx.currentTime); 
            osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.04);
            gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
            osc.start(); osc.stop(audioCtx.currentTime + 0.05);
        } catch (e) {}
    }

    function createPanelHTML(initialChar) {
        const displayChar = initialChar === " " ? "&nbsp;" : initialChar;
        return `
            <div class="half-panel static-top"><span>${displayChar}</span></div>
            <div class="half-panel static-bottom"><span>${displayChar}</span></div>
            <div class="leaf-wrapper">
                <div class="half-panel leaf-front-panel"><span>${displayChar}</span></div>
                <div class="half-panel leaf-back-panel"><span>${displayChar}</span></div>
            </div>
        `;
    }

    // 🛠️ 規則修正：所有翻板初始狀態一律強制為 " " (空白)
    function rebuildTrack(totalCards, sourceCharsArray) {
        const track = document.getElementById('panTrack');
        track.innerHTML = "";
        currentStates = {};
        cardRandomTargets = {}; 
        track.style.transform = "translateX(0px)"; 

        for (let i = 0; i < totalCards; i++) {
            const cardId = `card-${i}`;
            
            // 幕後抽好這塊板子等一下要路過的隨機字
            const randomPick = sourceCharsArray[Math.floor(Math.random() * sourceCharsArray.length)];
            cardRandomTargets[cardId] = randomPick;

            const card = document.createElement('div');
            card.className = 'flip-card';
            card.id = cardId;
            card.innerHTML = createPanelHTML(" "); // 👈 表面初始為空白
            track.appendChild(card);
            
            currentStates[cardId] = " "; 
        }
    }

    function runPhysicalFlipAnimation(id, newVal, oldVal) {
        const el = document.getElementById(id);
        if (!el) return;
        
        const displayNew = newVal === " " ? "<span>&nbsp;</span>" : `<span>${newVal}</span>`;
        const displayOld = oldVal === " " ? "<span>&nbsp;</span>" : `<span>${oldVal}</span>`;

        el.querySelector('.static-top').innerHTML = displayNew;
        el.querySelector('.static-bottom').innerHTML = displayOld;
        el.querySelector('.leaf-front-panel').innerHTML = displayOld;
        el.querySelector('.leaf-back-panel').innerHTML = displayNew;

        el.classList.remove('flipping');
        void el.offsetWidth; 
        el.classList.add('flipping');

        setTimeout(() => { playFlapSound(); }, 20);
        setTimeout(() => { el.querySelector('.static-bottom').innerHTML = displayNew; }, 160); 
    }

    // 🛠️ 雙階段精準翻轉控制器
    function flipCardToTargetFlow(id, finalTargetVal, customSeq) {
        return new Promise(async (resolve) => {
            finalTargetVal = finalTargetVal.toUpperCase();
            const randomTargetVal = cardRandomTargets[id].toUpperCase();

            // 建立標準字串序列庫
            let baseSeq = [];
            if (NUM_SEQ.includes(finalTargetVal)) {
                baseSeq = NUM_SEQ.split('');
            } else if (ALPHA_SEQ.includes(finalTargetVal)) {
                baseSeq = ALPHA_SEQ.split('');
            } else {
                baseSeq = [...customSeq];
            }

            // --- 【第一階段】：從 空白 翻到 隨機字 ---
            await new Promise((res) => {
                let current = currentStates[id]; // 必定是 " "
                if (current === randomTargetVal) { res(); return; }

                // 隨機字序列：[" ", 隨機字] 或是中間夾一兩個字增加滾動感
                let stepSeq = [" ", randomTargetVal];
                let idx = 0;

                let interval = setInterval(() => {
                    idx++;
                    let next = stepSeq[idx];
                    runPhysicalFlipAnimation(id, next, currentStates[id]);
                    currentStates[id] = next;

                    if (next === randomTargetVal) {
                        clearInterval(interval);
                        res();
                    }
                }, 140);
            });

            // 在隨機字狀態稍微停頓 250 毫秒，營造機械咬合感
            await new Promise(r => setTimeout(r, 250));

            // --- 【第二階段】：從 隨機字 依字串順序翻到 目標字 ---
            await new Promise((res) => {
                let current = currentStates[id];
                if (current === finalTargetVal) { res(); return; }

                // 以 baseSeq 為基礎，找出隨機字起點，順向滾動
                let startIdx = baseSeq.indexOf(current);
                let seq = [];
                if (startIdx !== -1) {
                    seq = baseSeq.slice(startIdx).concat(baseSeq.slice(0, startIdx));
                } else {
                    seq = [current, ...baseSeq];
                }

                let idx = 0;
                let interval = setInterval(() => {
                    idx = (idx + 1) % seq.length;
                    let next = seq[idx];
                    runPhysicalFlipAnimation(id, next, currentStates[id]);
                    currentStates[id] = next;

                    if (next === finalTargetVal) {
                        clearInterval(interval);
                        res();
                    }
                }, 140);
            });

            resolve();
        });
    }

    // 核心播放控制
    async function processMessage(fullText) {
        if (isPlaying) return;
        isPlaying = true;
        initAudio();

        const lines = fullText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
        if (lines.length === 0) { isPlaying = false; return; }

        for (let line of lines) {
            let processedLine = line;
            if (processedLine.length < 6) {
                const padding = "甲乙丙丁戊己";
                processedLine = processedLine + padding.substring(0, 6 - processedLine.length);
            }

            const charsArray = processedLine.split('');
            const totalCards = charsArray.length;
            
            // 初始化全空白看板
            rebuildTrack(totalCards, charsArray);
            await new Promise(r => setTimeout(r, 500)); // 靜態空白保持半秒再開翻

            const track = document.getElementById('panTrack');
            
            for (let i = 0; i < totalCards; i++) {
                if (i >= 4) {
                    const cardWidth = document.querySelector('.flip-card').offsetWidth;
                    const gapWidth = window.innerWidth * 0.03; 
                    const offset = (i - 3) * (cardWidth + gapWidth);
                    track.style.transform = `translateX(-${offset}px)`;
                    await new Promise(r => setTimeout(r, 350)); 
                }

                // 呼叫全新的雙階段翻轉流程
                await flipCardToTargetFlow(`card-${i}`, charsArray[i], charsArray);
                await new Promise(r => setTimeout(r, 180)); 
            }
            await new Promise(r => setTimeout(r, 1500)); 
        }

        isPlaying = false;

        if (isRecordingActive) {
            stopAndSaveRecording();
        }
    }

    function playCurrentInput() {
        const text = document.getElementById('msgInput').value;
        processMessage(text || "大家新年快樂");
    }

    // Canvas 錄影橋樑
    function syncViewportToCanvas() {
        if (!isRecordingActive) return;
        const v = document.getElementById('viewport');
        const canvas = document.getElementById('recordingCanvas');
        const ctx = canvas.getContext('2d');

        if (canvas.width !== v.offsetWidth) {
            canvas.width = v.offsetWidth;
            canvas.height = v.offsetHeight;
        }

        html2canvas(v, {
            backgroundColor: "#000",
            scale: 1, 
            logging: false
        }).then(snapCanvas => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(snapCanvas, 0, 0);
            if (isRecordingActive) {
                canvasAnimLoop = requestAnimationFrame(syncViewportToCanvas);
            }
        });
    }

    function startAutoRecordFlow() {
        if (isPlaying) return;
        initAudio();
        toggleControls(false);
        
        const canvas = document.getElementById('recordingCanvas');
        isRecordingActive = true;
        
        syncViewportToCanvas();

        const stream = canvas.captureStream(30);
        recordedChunks = [];
        
        mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp8' });
        mediaRecorder.ondataavailable = e => { if (e.data && e.data.size > 0) recordedChunks.push(e.data); };
        mediaRecorder.onstop = () => {
            cancelAnimationFrame(canvasAnimLoop);
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `mechanical_perfect_${Date.now()}.webm`;
            a.click();
            toggleControls(true);
        };

        mediaRecorder.start();

        setTimeout(() => {
            playCurrentInput();
        }, 300);
    }

    function stopAndSaveRecording() {
        isRecordingActive = false;
        if (mediaRecorder && mediaRecorder.state === "recording") {
            mediaRecorder.stop();
        }
    }

    function toggleControls(show) {
        document.getElementById('controlPanel').style.display = show ? 'block' : 'none';
        document.getElementById('restoreBtn').style.display = show ? 'none' : 'block';
    }

    function shareURL() {
        const msg = document.getElementById('msgInput').value;
        if (!msg) { alert("請先輸入訊息！"); return; }
        const url = `${window.location.origin}${window.location.pathname}?msg=${encodeURIComponent(msg)}`;
        navigator.clipboard.writeText(url).then(() => alert("網址已複製！"));
    }

    window.onload = () => {
        rebuildTrack(4, [" ", " ", " ", " "]); 
        const params = new URLSearchParams(window.location.search);
        if (params.has('msg')) {
            document.getElementById('msgInput').value = params.get('msg');
            setTimeout(() => { startAutoRecordFlow(); }, 1200);
        }
    };
    window.addEventListener('click', initAudio, { once: true });
</script>

</body>
</html>
